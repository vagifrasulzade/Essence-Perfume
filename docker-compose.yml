services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: perfume-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Salam123!@
    ports:
      - "1433:1433"
    networks:
      - perfume-net
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Salam123!@ -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./back-end/Server
      dockerfile: Dockerfile
    image: perfume-backend:latest
    container_name: perfume-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=perfume-sql,1433;Database=PerfumeDB;User Id=sa;Password=Salam123!@;TrustServerCertificate=True;
    ports:
      - "5000:5000"
    networks:
      - perfume-net
    restart: on-failure

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    image: perfume-frontend:latest
    container_name: perfume-frontend
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    ports:
      - "3000:3000"
    networks:
      - perfume-net
    restart: on-failure

networks:
  perfume-net:

volumes:
  mssql_data: